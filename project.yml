name: TelegramPlay
options:
  bundleIdPrefix: com.telegramplay
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Config/Secrets.xcconfig
  Release: Config/Secrets.xcconfig
packages:
  MPVKit:
    url: https://github.com/mpvkit/MPVKit.git
    from: 1.0.0
  TDLibKit:
    url: https://github.com/Swiftgram/TDLibKit.git
    revision: e5f11d8d882cefec403af68169c81419588803cc
targets:
  TelegramPlay:
    type: application
    platform: iOS
    sources:
      - path: TelegramPlay
    dependencies:
      - product: MPVKit
        package: MPVKit
      - product: TDLibKit
        package: TDLibKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.telegramplay.app
        SWIFT_VERSION: "5.9"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        ENABLE_PREVIEWS: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        OTHER_LDFLAGS: "$(inherited) -lc++"
    info:
      path: TelegramPlay/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        TelegramApiId: $(TELEGRAM_API_ID)
        TelegramApiHash: $(TELEGRAM_API_HASH)
